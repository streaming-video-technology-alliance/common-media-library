<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Redirecting</title>
<script>var h = location.hash.slice(1);h = h.replace(/_/g, '-').replace(/^-+|-+$/g, '');location.replace("/api/" + (h ? '#' + h : ''))</script>
<meta http-equiv="refresh" content="0; url=/api/">
<link rel="canonical" href="/api/">
<meta name="robots" content="noindex">
</head>
<body>
<p>This page moved to <a href="/api/">/api/</a>.</p>
</body>
</html>
