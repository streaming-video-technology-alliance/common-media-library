name: Site

on:
  pull_request:
    paths:
      - "site/**"
      - "libs/*/README.md"
      - "libs/*/docs/**"
      - "libs/*/CHANGELOG.md"
      - "scripts/projects.ts"
      - ".github/workflows/site.pr.yml"

permissions:
  contents: read

jobs:
  site:
    concurrency:
      group: site-${{ github.ref }}
      cancel-in-progress: true

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Build Site
        run: npm run build -w site
        env:
          SITE_BASE: /common-media-library/
