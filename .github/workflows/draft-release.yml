name: Draft Release

on:
  workflow_dispatch:

env:
  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
  PKG_VERSION: ""

jobs:
  draft-release:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
      - uses: actions/setup-node@v3
        with:
          node-version: 24
          cache: "npm"
          registry-url: "https://registry.npmjs.org"
          scope: "@svta"

      - name: Install
        run: npm ci

      - name: Get Version
        run: echo "PKG_VERSION=`node -p "require('./package').version"`" >> $GITHUB_ENV

      - name: Create Release Notes
        run: npm run notes

      - name: Draft Release
        run: gh release create "v${PKG_VERSION}" --draft --target main --title "${PKG_VERSION}" --notes-file ./RELEASE.md
        env:
          GH_TOKEN: ${{ secrets.GH_ACTIONS }}
