name: Publish

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "npm"
          registry-url: "https://registry.npmjs.org"
          scope: "@svta"

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      # This workflow cannot publish a package that is not on npm yet.
      # See "Publishing a New Package" in AGENTS.md.
      - name: Publish
        run: npm run pub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Site
        run: npm run build -w site
        env:
          SITE_BASE: /common-media-library/

      - name: Deploy Site
        uses: peaceiris/actions-gh-pages@v4
        with:
          publish_dir: ./site/dist/
          personal_token: ${{ secrets.GH_ACTIONS }}
